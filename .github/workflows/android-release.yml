name: Android GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/upload (for example: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Check release signing secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD to the repository secrets."
            exit 1
          fi

      - name: Decode signing keystore
        shell: bash
        run: |
          mkdir -p flutter/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > flutter/android/app/release-keystore.jks

      - name: Write key.properties
        shell: bash
        run: |
          cat > flutter/android/key.properties <<EOF
          storeFile=app/release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Fetch Flutter dependencies
        working-directory: flutter
        shell: bash
        run: flutter pub get

      - name: Build Android App Bundle
        working-directory: flutter
        shell: bash
        run: flutter build appbundle --release

      - name: Build Android APK
        working-directory: flutter
        shell: bash
        run: flutter build apk --release

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$TAG_NAME" || "$TAG_NAME" != v* ]]; then
            echo "A release tag starting with v is required (for example: v1.0.2)."
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            flutter/build/app/outputs/bundle/release/app-release.aab
            flutter/build/app/outputs/flutter-apk/app-release.apk
