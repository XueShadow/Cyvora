name: Android GitHub Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-test*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing stable release tag to publish (for example: v1.0.1)'
        required: true

permissions: {}

jobs:
  validate-release:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release_ref.outputs.tag_name }}
      target_sha: ${{ steps.release_ref.outputs.target_sha }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Test release ref policy
        run: python3 flutter/scripts/test_validate_android_release_ref.py

      - name: Validate release tag and protected-branch ancestry
        id: release_ref
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/${DEFAULT_BRANCH}"
          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag_name="$GITHUB_REF_NAME"
          else
            tag_name="$TAG_INPUT"
          fi

          python3 flutter/scripts/validate_android_release_ref.py \
            --tag "$tag_name" \
            --default-branch "$DEFAULT_BRANCH" \
            --event-name "$EVENT_NAME" \
            --event-ref "$EVENT_REF"

          target_sha="$(git rev-parse --verify "refs/tags/${tag_name}^{commit}")"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  build-and-validate:
    needs: validate-release
    runs-on: ubuntu-latest
    environment:
      name: android-signing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Validate and fetch Flutter dependencies
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          mkdir -p build
          flutter pub deps --json > build/dependencies.json

      - name: Analyze Flutter code
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos

      - name: Run Flutter tests
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub

      - name: Download previous production APK
        id: previous_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease |
            jq -r --arg current "$RELEASE_TAG" \
              'map(select(.isPrerelease == false and .isDraft == false and .tagName != $current)) | .[0].tagName // empty')"
          if [[ -z "$previous_tag" ]]; then
            echo "previous_apk=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$previous_dir"
          previous_asset="$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '
              [.assets[].name] as $assets
              | if ($assets | index("cyvora-universal-release.apk")) then "cyvora-universal-release.apk"
                elif ($assets | index("app-release.apk")) then "app-release.apk"
                else "" end
            ')"
          if [[ -z "$previous_asset" ]]; then
            echo "The previous production release does not contain a recognized APK asset."
            exit 1
          fi
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$previous_asset" --dir "$previous_dir"
          echo "previous_apk=$previous_dir/$previous_asset" >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android signing environment secrets. Configure them in the protected android-signing environment."
            exit 1
          fi

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p flutter/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter/android/app/release-keystore.jks
          test -s flutter/android/app/release-keystore.jks

      - name: Write key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf 'storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > flutter/android/key.properties

      - name: Build Android App Bundle
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release

      - name: Build Android APK
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Validate and stage release artifacts
        working-directory: flutter
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
          PREVIOUS_APK: ${{ steps.previous_release.outputs.previous_apk }}
        run: |
          set -euo pipefail
          args=(
            --apk build/app/outputs/flutter-apk/app-release.apk
            --aab build/app/outputs/bundle/release/app-release.aab
            --output-dir build/release-validation
            --tag "$RELEASE_TAG"
          )
          if [[ -n "$PREVIOUS_APK" ]]; then
            args+=(--previous-apk "$PREVIOUS_APK")
          fi
          python3 scripts/validate_android_release.py "${args[@]}"

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyvora-android-release-${{ needs.validate-release.outputs.tag_name }}
          path: |
            flutter/build/release-validation/cyvora-universal-release.apk
            flutter/build/release-validation/cyvora-release.aab
            flutter/build/release-validation/SHA256SUMS.txt
            flutter/build/release-validation/APK_CERT_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f flutter/android/app/release-keystore.jks flutter/android/key.properties

  publish-release:
    needs:
      - validate-release
      - build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: android-publish
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cyvora-android-release-${{ needs.validate-release.outputs.tag_name }}
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/cyvora-universal-release.apk
            release-artifacts/cyvora-release.aab
            release-artifacts/SHA256SUMS.txt
            release-artifacts/APK_CERT_SHA256.txt
