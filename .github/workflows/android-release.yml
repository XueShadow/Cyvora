name: Android GitHub Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-test*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/upload (for example: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: flutter
        shell: bash
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: flutter
        shell: bash
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        working-directory: flutter
        shell: bash
        run: flutter test --no-pub

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$TAG_INPUT"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "A valid version tag starting with v is required (for example: v1.0.2)."
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD to the repository secrets."
            exit 1
          fi

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p flutter/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter/android/app/release-keystore.jks

      - name: Write key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > flutter/android/key.properties

      - name: Build Android App Bundle
        working-directory: flutter
        shell: bash
        run: flutter build appbundle --release

      - name: Build Android APK
        working-directory: flutter
        shell: bash
        run: flutter build apk --release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            flutter/build/app/outputs/bundle/release/app-release.aab
            flutter/build/app/outputs/flutter-apk/app-release.apk
